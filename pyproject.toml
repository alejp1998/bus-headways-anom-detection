[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bus-headways-anom-detection"
version = "2.0.0"
description = "Real-Time Bus Headway Modeling, QoS Estimation, and Anomaly Detection for Madrid (EMT) and London (TfL)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Alejandro Jarabo-Peñas", email = "alejp@mmmi.sdu.dk" }
]
keywords = ["transportation", "anomaly-detection", "time-series", "headways", "dash", "plotly"]
dependencies = [
    "dash>=2.17.0",
    "plotly>=5.22.0",
    "flask>=3.0.0",
    "flask-compress>=1.14",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "networkx>=3.2.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "python-dateutil>=2.8.2",
    "pytz>=2024.1",
    "brotli>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501", # Line too long (handled by formatter)
    "B008", # Do not perform function call in argument defaults
    "B905", # zip() without an explicit strict= parameter
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "E722", "F821", "F811", "B018", "C408"]
"Madrid/Scripts/CollectData/retrieve_data.py" = ["E402"]
"Dashboard/apps/app_realtime_*.py" = ["E402"]
"tests/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app", "apps"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
